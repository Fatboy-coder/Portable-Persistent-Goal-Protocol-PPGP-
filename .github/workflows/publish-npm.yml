name: Publish PPGP to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing GitHub Release version, for example 0.1.2"
        required: true
        type: string
  workflow_run:
    workflows: ["Publish PPGP release"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$(printf '%s' "$INPUT_VERSION" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[Vv]//; s/[[:space:]]+//g')"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: '$INPUT_VERSION'"
              exit 1
            fi
            REF="v${VERSION}"
          else
            if [[ -z "${UPSTREAM_SHA:-}" ]]; then
              echo "Missing upstream release workflow SHA."
              exit 1
            fi
            REF="$UPSTREAM_SHA"
            VERSION=""
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "requested_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@fatboy-coder"
          package-manager-cache: false

      - name: Validate published release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ steps.source.outputs.requested_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: '$VERSION'"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match package.json version $VERSION."
            exit 1
          fi

          TAG="v${VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG does not exist. Refusing to publish npm before the canonical release."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and inspect package
        run: |
          npm test
          npm pack --dry-run --ignore-scripts

      - name: Publish public npm package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE="@fatboy-coder/ppgp"

          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already exists on npmjs.com; skipping."
            exit 0
          fi

          if [[ -n "${NPM_TOKEN:-}" ]]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "Publishing with the repository NPM_TOKEN secret."
          else
            echo "No NPM_TOKEN secret is configured. Attempting npm Trusted Publishing through GitHub OIDC."
          fi

          npm publish --access public

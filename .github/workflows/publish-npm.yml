name: Publish PPGP to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm package version, for example 0.1.0"
        required: true
        default: "0.1.0"
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Normalize package version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$(printf '%s' "$INPUT_VERSION" | sed -E 's/^[[:space:]]*version:[[:space:]]*//' | tr -d '[:space:]')"
            VERSION="${VERSION#v}"
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid npm version: '$VERSION'"
            echo "Use a SemVer version such as 0.1.0."
            exit 1
          fi

          npm pkg set version="$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and inspect package
        run: |
          npm test
          npm pack --dry-run

      - name: Publish public npm package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if npm view "ppgp@$VERSION" version >/dev/null 2>&1; then
            echo "ppgp@$VERSION already exists on npmjs.com; skipping."
            exit 0
          fi

          if [[ -n "${NPM_TOKEN:-}" ]]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "Publishing with the repository NPM_TOKEN secret."
          else
            echo "No NPM_TOKEN secret is configured. Attempting npm Trusted Publishing through GitHub OIDC."
          fi

          npm publish --access public

name: Publish PPGP to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing GitHub Release version, for example 0.1.2"
        required: true
        type: string
  workflow_run:
    workflows: ["Publish PPGP to npm"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$(printf '%s' "$INPUT_VERSION" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[Vv]//; s/[[:space:]]+//g')"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: '$INPUT_VERSION'"
              exit 1
            fi
            REF="v${VERSION}"
          else
            if [[ -z "${UPSTREAM_SHA:-}" ]]; then
              echo "Missing upstream npm workflow SHA."
              exit 1
            fi
            REF="$UPSTREAM_SHA"
            VERSION=""
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "requested_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@fatboy-coder"
          package-manager-cache: false

      - name: Validate published release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ steps.source.outputs.requested_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: '$VERSION'"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match package.json version $VERSION."
            exit 1
          fi

          TAG="v${VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG does not exist. Refusing to publish GitHub Packages before the canonical release."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test source package
        run: npm test

      - name: Prepare scoped GitHub package
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent --ignore-scripts)"
          mkdir -p "$RUNNER_TEMP/ppgp-gh"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/ppgp-gh" --strip-components=1
          cd "$RUNNER_TEMP/ppgp-gh"
          npm pkg set name="@fatboy-coder/ppgp"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm pkg set repository.url="git+https://github.com/Fatboy-coder/ppgp.git"

      - name: Inspect prepared package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ppgp-gh"
          npm pack --dry-run --ignore-scripts

      - name: Publish GitHub Package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ppgp-gh"

          if npm view "@fatboy-coder/ppgp@$VERSION" version --registry="https://npm.pkg.github.com" >/dev/null 2>&1; then
            echo "@fatboy-coder/ppgp@$VERSION already exists in GitHub Packages; skipping."
            exit 0
          fi

          npm publish --ignore-scripts --access public --registry="https://npm.pkg.github.com"

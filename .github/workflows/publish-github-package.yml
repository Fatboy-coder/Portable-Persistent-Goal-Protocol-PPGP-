name: Publish PPGP to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@fatboy-coder"
          package-manager-cache: false

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: '$VERSION'"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Release tag version $VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test source package
        run: npm test

      - name: Prepare scoped GitHub package
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent --ignore-scripts)"
          mkdir -p "$RUNNER_TEMP/ppgp-gh"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/ppgp-gh" --strip-components=1
          cd "$RUNNER_TEMP/ppgp-gh"
          npm pkg set name="@fatboy-coder/ppgp"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm pkg set repository.url="git+https://github.com/Fatboy-coder/ppgp.git"

      - name: Inspect prepared package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ppgp-gh"
          npm pack --dry-run --ignore-scripts

      - name: Publish GitHub Package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ppgp-gh"

          if npm view "@fatboy-coder/ppgp@$VERSION" version --registry="https://npm.pkg.github.com" >/dev/null 2>&1; then
            echo "@fatboy-coder/ppgp@$VERSION already exists in GitHub Packages; skipping."
            exit 0
          fi

          npm publish --ignore-scripts --access public --registry="https://npm.pkg.github.com"

name: Publish PPGP release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1"
        required: true
        default: "0.1"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and validate version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          RAW_VERSION="$(printf '%s' "$RELEASE_VERSION" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          VERSION="$(printf '%s' "$RAW_VERSION" | sed -E 's/^[Vv][Ee][Rr][Ss][Ii][Oo][Nn][[:space:]]*:[[:space:]]*//; s/^[Vv][[:space:]]*//; s/[[:space:]]+//g')"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: '$RELEASE_VERSION'"
            echo "Accepted examples: 0.1, v0.1, 0.1.0, or version: 0.1"
            exit 1
          fi

          TAG="v${VERSION}"
          git check-ref-format "refs/tags/${TAG}"

          echo "Normalized release version: ${VERSION}"
          echo "Release tag: ${TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=ppgp-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build installable skill archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          rm -f "$ARCHIVE" "$ARCHIVE.sha256"
          cd skills
          zip -r "../$ARCHIVE" ppgp
          cd ..
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Create release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # Portable Persistent Goal Protocol ${TAG}

          Experimental public release of PPGP, a vendor-neutral continuity protocol for long-running coding agents.

          ## Install

          Agent Skills CLI:

          \`\`\`bash
          npx skills add https://github.com/Fatboy-coder/ppgp/tree/main/skills/ppgp
          \`\`\`

          Manual install: download \`${ARCHIVE}\`, extract it, then copy or upload the \`ppgp\` skill directory into an Agent Skills-compatible client.

          ## Test and evaluate

          Read \`EVALUATION.md\` and report reproducible results through the repository issue forms.

          ## Specification and citation

          Use the exact version evaluated. See \`SPEC.md\` and \`CITATION.cff\`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" \
              "$ARCHIVE" \
              "$ARCHIVE.sha256" \
              --verify-tag \
              --title "PPGP ${TAG} (Experimental)" \
              --notes-file release-notes.md
          fi

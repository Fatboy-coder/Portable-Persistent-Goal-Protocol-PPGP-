name: Publish PPGP release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@fatboy-coder"
          package-manager-cache: false

      - name: Normalize and validate version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(printf '%s' "$RELEASE_VERSION" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[Vv]//; s/[[:space:]]+//g')"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: '$RELEASE_VERSION'"
            echo "Use an immutable three-part SemVer such as 0.1.1."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Release input $VERSION does not match committed package.json version $PACKAGE_VERSION."
            echo "Commit the release version before publishing."
            exit 1
          fi

          TAG="v${VERSION}"
          git check-ref-format "refs/tags/${TAG}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists. Refusing to overwrite an immutable release."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists. Refusing to overwrite an immutable release."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=ppgp-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "protocol_archive=ppgp-v0.1.zip" >> "$GITHUB_OUTPUT"

      - name: Validate source and npm payload
        run: |
          set -euo pipefail
          npm test
          npm pack --dry-run --ignore-scripts

      - name: Build installable skill archives
        shell: bash
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
          PROTOCOL_ARCHIVE: ${{ steps.version.outputs.protocol_archive }}
        run: |
          set -euo pipefail
          rm -f "$ARCHIVE" "$ARCHIVE.sha256" "$PROTOCOL_ARCHIVE" "$PROTOCOL_ARCHIVE.sha256"
          cd skills
          zip -r "../$ARCHIVE" ppgp
          cd ..
          cp "$ARCHIVE" "$PROTOCOL_ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          sha256sum "$PROTOCOL_ARCHIVE" > "$PROTOCOL_ARCHIVE.sha256"

      - name: Create immutable release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          PROTOCOL_ARCHIVE: ${{ steps.version.outputs.protocol_archive }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # Portable Persistent Goal Protocol ${TAG}

          Experimental public release of PPGP, a vendor-neutral continuity protocol for long-running coding agents.

          ## Install

          Agent Skills CLI:

          \`\`\`bash
          npx skills add https://github.com/Fatboy-coder/ppgp/tree/main/skills/ppgp
          \`\`\`

          Manual install: download \`${ARCHIVE}\`, extract it, then copy or upload the \`ppgp\` skill directory into an Agent Skills-compatible client. \`${PROTOCOL_ARCHIVE}\` is retained as the stable protocol-v0.1 download alias.

          npm and GitHub Packages publication are triggered automatically from this published GitHub Release.

          ## Test and evaluate

          Read \`EVALUATION.md\` and \`BENCHMARK_PROTOCOL.md\` for the current evaluation methodology and reproducible pilot infrastructure.

          ## Specification and citation

          Use the exact version evaluated. See \`SPEC.md\` and \`CITATION.cff\`.
          EOF

          gh release create "$TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            "$PROTOCOL_ARCHIVE" \
            "$PROTOCOL_ARCHIVE.sha256" \
            --verify-tag \
            --title "PPGP ${TAG} (Experimental)" \
            --notes-file release-notes.md
